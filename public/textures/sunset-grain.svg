<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <filter id="grain" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency=".64" numOctaves="3" seed="19" stitchTiles="stitch" result="fine"/>
    <feTurbulence type="fractalNoise" baseFrequency=".23" numOctaves="2" seed="41" stitchTiles="stitch" result="coarse"/>
    <feComposite in="fine" in2="coarse" operator="arithmetic" k1="0" k2=".55" k3=".45" k4="0"/>
    <feColorMatrix type="saturate" values="0"/>
    <feComponentTransfer>
      <feFuncR type="linear" slope="3.2" intercept="-1.1"/>
      <feFuncG type="linear" slope="3.2" intercept="-1.1"/>
      <feFuncB type="linear" slope="3.2" intercept="-1.1"/>
      <feFuncA type="linear" slope="0" intercept="1"/>
    </feComponentTransfer>
  </filter>
  <rect width="256" height="256" filter="url(#grain)"/>
</svg>
